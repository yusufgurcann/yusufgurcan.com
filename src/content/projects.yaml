# Projeler. Yeni bir proje eklemek için aynı yapıda yeni bir öğe ekleyin.
#
# display     : featured (en üstte büyük vitrin) | card (normal kart) | mention (sadece adıyla "Ayrıca" satırında)
# icon        : /public altındaki ikon yolu, ör. /projects/blokla/icon.png
# screenshots : [{ src: /projects/blokla/1.png, alt: { tr, en } }]
#               Boşsa, vitrin projesinde arayüzden esinlenen çizim gösterilir.
# context     : projenin türü (kişisel, okul, gönüllü…)
# work        : yaptıklarım, madde madde (isteğe bağlı)
# status      : null bırakılırsa geliştirme ortamında "eklenecek" olarak görünür, yayında gizlenir.
# links       : [{ label: { tr, en }, url: https://... }]  (örn. GitHub deposu, App Store sayfası)
# color       : clay | amber | sea | sky | plum | moss | rose | ink

- id: blokla
  order: 1
  display: featured
  name: Blokla!
  color: clay
  icon: /projects/blokla/icon.png
  # Ekran görüntüleri hazır olunca public/projects/blokla/ altına koyup buraya ekleyin:
  # screenshots:
  #   - src: /projects/blokla/oyun.png
  #     alt: { tr: Oyun ekranı, en: Game screen }
  screenshots: []
  context: { tr: Kişisel proje · iOS, en: Personal project · iOS }
  tagline:
    tr: Sade ve akıcı bir blok bulmaca oyunu
    en: A simple, smooth block puzzle game
  purpose:
    tr: >-
      Parçaları ızgaraya yerleştirip satır ve sütunları temizlediğin, sakin ama akıcı bir blok
      bulmaca deneyimi. Bir fikri uygulamaya dönüştürürken ürün geliştirme sürecini baştan sona
      yaşadığım proje.
    en: >-
      A calm but snappy block puzzle where you place pieces on a grid and clear rows and columns.
      The project where I’m going through the whole product development process, from idea to app.
  role:
    tr: Kişisel projem. Oyunun geliştirilmesini kendim yürütüyorum.
    en: My personal project. I handle the game’s development myself.
  work:
    tr:
      - SwiftUI ile arayüz; oyun kurallarını arayüzden ayıran, test edilebilir bir Swift Package çekirdeği
      - Farklı görünümler sunan tema sistemi
      - Türkçe ve İngilizce dil desteği
    en:
      - SwiftUI interface, with a testable Swift Package core that keeps game rules apart from the UI
      - A theme system offering different looks
      - Turkish and English localization
  stack: [Swift, SwiftUI, Swift Package]
  status:
    tr: App Store incelemesinde
    en: In App Store review
  focus:
    tr:
      - Blokların ızgaraya doğru yerleşmesi
      - Dokunmatik kontrol hassasiyeti
      - Skor dengesi
      - Akıcı animasyonlar
    en:
      - Placing blocks correctly on the grid
      - Touch control precision
      - Score balance
      - Smooth animations
  links: []

