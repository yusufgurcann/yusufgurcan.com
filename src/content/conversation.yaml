# "Tanışalım" sohbeti. Ziyaretçi sorar (question), Yusuf cevaplar (answer).
# Cevaplar kısa tutulmalı; her biri bir mesaj balonu olarak görünür.

- id: real-work
  order: 1
  question:
    tr: Merhaba! Gerçek projelerde çalıştın mı?
    en: Hi! Have you worked on real projects?
  answer:
    tr: >-
      Evet. Farklı şirketlerde mobil uygulama geliştirme süreçlerinde görev aldım, freelance ve
      gönüllü projelerde yer aldım. Ayrıca bağımsız olarak geliştirdiğim ve şu anda App Store
      inceleme sürecinde olan bir iOS oyunum var.
    en: >-
      Yes. I’ve worked on mobile app development at different companies and taken part in
      freelance and volunteer projects. I also have an iOS game I built independently, which is
      currently in App Store review.

- id: handoff
  order: 2
  question:
    tr: Sana bir iş verdiğimizde ne olur?
    en: What happens when we give you a task?
  answer:
    tr: >-
      Önce ne istendiğini netleştiririm. Sonra yaparım, test ederim, takıldığım yerde erkenden
      haber veririm ve teslim ederim. Sürpriz yaşatmam; işin nerede olduğunu her zaman bilirsiniz.
    en: >-
      First I make sure I understand what’s needed. Then I build it, test it, flag it early if I
      get stuck, and hand it over. No surprises; you always know where the work stands.

- id: unknown
  order: 3
  question:
    tr: Bilmediğin bir konuyla karşılaşınca ne yaparsın?
    en: What do you do when you run into something you don’t know?
  answer:
    tr: >-
      Biliyormuş gibi yapmam. Bilmediğimi söylerim, araştırırım, ekipten öğrenirim ve
      öğrendiğimi bir projede denerim.
    en: >-
      I don’t pretend. I say I don’t know, look into it, learn from the team, and then try what
      I’ve learned in a project.

- id: team
  order: 4
  question:
    tr: Ekiple aran nasıl?
    en: How do you get along with a team?
  answer:
    tr: >-
      İyi; bugüne kadar hep ekip içinde çalıştım. Aidata’da üretimde, Dijital Gen’de aynı kod
      tabanında, İyiliği Kodlayanlar’da gönüllü bir ekipte. Ne yaptığımı paylaşırım, yardım
      istemekten de yardım etmekten de çekinmem. Ekibin ritmine uyar, kendi payımı aksatmam.
    en: >-
      Well; I’ve always worked in teams. In production at Aidata, on a shared codebase at Dijital
      Gen, in a volunteer team at İyiliği Kodlayanlar. I share what I’m working on, and I’m
      comfortable both asking for help and offering it. I fit into the team’s rhythm and never
      let my part slip.

- id: feedback
  order: 5
  question:
    tr: Kodun eleştirilirse?
    en: What if your code gets criticised?
  answer:
    tr: Sevinirim. Geri bildirim, bir sonraki sürümün daha iyi olması demek.
    en: I’m glad. Feedback means the next version will be better.

- id: goal
  order: 6
  question:
    tr: Nasıl bir yerde çalışmak istiyorsun?
    en: Where would you like to work?
  answer:
    tr: >-
      Gerçek ürünler geliştiren bir mobil ekipte. Yükü tek başına sırtlayan biri değil; işini
      güvenle teslim eden, toplantıda fikrini söyleyen, daha iyi bir yol gördüğünde öneren ve
      zamanla ekibe yön vermeye katkı sunan biri olmak istiyorum.
    en: >-
      In a mobile team that builds real products. Not someone who carries the whole load alone,
      but someone who delivers reliably, speaks up with ideas, suggests a better way when they
      see one, and over time helps shape the team’s direction.
