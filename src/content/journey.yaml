      - Mevcut uygulamada hata düzeltmeleri ve geliştirme çalışmaları yaptım.
      - Arayüzü ve kullanıcı deneyimini iyileştiren düzenlemeler yaptım.
      - Proje ekibiyle koordineli çalışarak kararlı sürümlerin hazırlanmasına katkı sağladım.
    en:
      - Fixed bugs and carried out improvements in the existing app.
      - Made changes that improved the interface and user experience.
      - Coordinated with the project team and contributed to preparing stable releases.

