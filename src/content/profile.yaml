# Giriş ve "Hakkımda" metinleri.
# Her metin { tr, en } olarak yazılır. Paragraflar liste elemanıdır.
- id: main
  role:
    tr: iOS & Flutter Developer
    en: iOS & Flutter Developer
  headline:
    tr: Verdiğiniz işi sahiplenir, test eder ve içiniz rahat teslim ederim.
    en: I own the work you give me, test it, and hand it over so you don’t have to worry.
  languages:
    tr: Türkçe · İngilizce
    en: Turkish · English
  intro:
    tr: >-
      Flutter ile stajlarda, freelance ve gönüllü projelerde gerçek mobil uygulamalar üzerinde
      çalıştım. iOS tarafında Swift ve SwiftUI ile kendi oyunum Blokla’yı geliştirip App Store’da
      yayınladım.
      Ekibinizin yükünü hafifletmeye hazırım.
    en: >-
      I’ve worked on real mobile apps with Flutter in internships, freelance and volunteer
      projects. On iOS, I built my own game, Blokla, with Swift and SwiftUI and shipped it to the
      App Store. Ready to take
      work off your team’s plate.
  # CV'deki profil özeti. ATS'ler anahtar kelimeleri burada arar; sade ve somut tutun.
  cv:
    summary:
      tr: >-
        iOS ve Flutter geliştiricisiyim. Uplide Teknoloji ve Dijital Gen’de mobil uygulama
        geliştirme süreçlerinde görev aldım: Flutter ile uygulama geliştirme, REST API
        entegrasyonu, arayüz geliştirme, hata düzeltme ve test. Freelance ve gönüllü projelerde
        yer aldım. Ayrıca Swift ve SwiftUI ile bağımsız olarak geliştirdiğim iOS oyunum Blokla,
        App Store’da yayında. İstanbul Topkapı Üniversitesi Yönetim Bilişim
        Sistemleri öğrencisiyim.
      en: >-
        iOS and Flutter developer. At Uplide Teknoloji and Dijital Gen, worked on mobile app
        development: building apps with Flutter, REST API integration, UI development, bug fixing
        and testing. Took part in freelance and volunteer projects. My iOS game Blokla, built
        independently with Swift and SwiftUI, is live on the App Store. Management
        Information Systems student at Istanbul Topkapı University.
  # Girişteki "Bir bakışta" kartı: işe alımcının ilk saniyede göreceği başlıklar.
  glance:
    label: { tr: Bir bakışta, en: At a glance }
    items:
      - title: { tr: Yazılım deneyimi, en: Software experience }
        description:
          tr: Uplide Teknoloji ve Dijital Gen’de staj deneyimi, mobil uygulama geliştirme ve ekip çalışması
          en: Internships at Uplide Teknoloji and Dijital Gen, mobile app development and teamwork
      - title: { tr: Freelance ve gönüllü projeler, en: Freelance and volunteer projects }
        description:
          tr: >-
            PetJoo’da freelance geliştirme deneyimi, İyiliği Kodlayanlar kapsamında sosyal fayda
            odaklı mobil uygulama geliştirme ve kişisel projeler
          en: >-
            Freelance development at PetJoo, social-impact mobile app development with İyiliği
            Kodlayanlar, and personal projects
      - title: { tr: Kişisel ürün, en: Personal product }
        description:
          tr: Bağımsız olarak geliştirip App Store’da yayınladığım iOS oyunu Blokla
          en: Blokla, an iOS game I built independently and shipped to the App Store
      - title: { tr: Teknik yetkinlikler, en: Technical skills }
        description:
          tr: >-
            Flutter ve Dart ile mobil uygulama geliştirme deneyimi, Swift ve SwiftUI ile native iOS
            geliştirme
          en: >-
            Mobile app development experience with Flutter and Dart, native iOS development with
            Swift and SwiftUI
  pitch:
    question:
      tr: Yapay zekânın kod yazdığı bir dönemde neden Yusuf?
      en: With AI writing code, why Yusuf?
    answer:
      tr: >-
        Yapay zekâ kod yazabilir ama işi sahiplenmez. Ekibinizin hâlâ verilen işi anlayan, yapan,
        test eden, takıldığında erkenden söyleyen ve sonunda içiniz rahat teslim eden birine
        ihtiyacı var. Hata düzeltme, arayüz geliştirme, API entegrasyonu ve test; bunları gerçek
        projelerde yaptım ve sizin ekibinizde de üstlenmeye hazırım.
      en: >-
        AI can write code, but it doesn’t own the work. Your team still needs someone who
        understands the task, does it, tests it, speaks up early when stuck, and hands it over
        so you can stop thinking about it. Bug fixes, UI work, API integrations, tests: I’ve done
        this on real projects and I’m ready to take it on in your team.
    offer:
      tr: Ekibinizin haftasını yiyen işleri bana bırakın; siz daha önemli olana odaklanın.
      en: Hand me the work that eats your team’s week, and focus on what matters more.
