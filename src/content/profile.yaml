# Giriş ve "Hakkımda" metinleri.
# Her metin { tr, en } olarak yazılır. Paragraflar liste elemanıdır.
- id: main
  role:
    tr: iOS & Flutter Developer
    en: iOS & Flutter Developer
  headline:
    tr: Verdiğiniz işi sahiplenir, test eder ve içiniz rahat teslim ederim.
    en: I own the work you give me, test it, and hand it over so you don’t have to worry.
  focus:
    tr: Mobil uygulama geliştirme · Flutter ve iOS (Swift, SwiftUI)
    en: Mobile app development · Flutter and iOS (Swift, SwiftUI)
  languages:
    tr: Türkçe · İngilizce
    en: Turkish · English
  intro:
    tr: >-
      Flutter ile stajlarda, freelance ve gönüllü projelerde gerçek mobil uygulamalar üzerinde
      çalıştım. iOS tarafında Swift ve SwiftUI ile kendi oyunum Blokla’yı geliştiriyorum.
      Ekibinizin yükünü hafifletmeye hazırım.
    en: >-
      I’ve worked on real mobile apps with Flutter in internships, freelance and volunteer
      projects. On iOS, I’m building my own game, Blokla, with Swift and SwiftUI. Ready to take
      work off your team’s plate.
  # CV'deki profil özeti. ATS'ler anahtar kelimeleri burada arar; sade ve somut tutun.
  cv:
    summary:
      tr: >-
        iOS ve Flutter geliştiricisiyim. Uplide Teknoloji ve Dijital Gen’deki yazılım stajlarımda
        Flutter ile mobil uygulama geliştirme, REST API entegrasyonu, arayüz geliştirme, hata
        düzeltme ve test süreçlerinde yer aldım; freelance ve gönüllü projelerde mevcut Flutter
        uygulamalarına katkı verdim. Şu anda Swift ve SwiftUI ile kişisel iOS oyunum Blokla’yı
        geliştiriyorum. İstanbul Topkapı Üniversitesi Yönetim Bilişim Sistemleri öğrencisiyim.
      en: >-
        iOS and Flutter developer. During software internships at Uplide Teknoloji and Dijital Gen,
        worked on Flutter mobile app development, REST API integration, UI development, bug fixing
        and testing; contributed to existing Flutter apps in freelance and volunteer projects.
        Currently building the personal iOS game Blokla with Swift and SwiftUI. Management
        Information Systems student at Istanbul Topkapı University.
  # Girişteki "Bir bakışta" kartı: işe alımcının ilk saniyede göreceği birkaç somut bilgi.
  glance:
    label: { tr: Bir bakışta, en: At a glance }
    facts:
      - value: { tr: '6', en: '6' }
        label:
          tr: İş ve staj kapsamında yer aldığım ürün
          en: Products I worked on in jobs and internships
      - value: { tr: '2', en: '2' }
        label:
          tr: Yazılım stajı · Uplide, Dijital Gen
          en: Software internships · Uplide, Dijital Gen
      - value: { tr: '1', en: '1' }
        label:
          tr: Freelance proje · PetJoo
          en: Freelance project · PetJoo
      - value: { tr: 1 yıl, en: 1 yr }
        label:
          tr: İyiliği Kodlayanlar · eğitim ve gönüllü geliştirme
          en: İyiliği Kodlayanlar · training and volunteer work
    now:
      tr: 'Şu an: Swift ve SwiftUI ile Blokla’yı geliştiriyorum'
      en: 'Right now: building Blokla with Swift and SwiftUI'
  pitch:
    question:
      tr: Yapay zekânın kod yazdığı bir dönemde neden Yusuf?
      en: With AI writing code, why Yusuf?
    answer:
      tr: >-
        Yapay zekâ kod yazabilir ama işi sahiplenmez. Ekibinizin hâlâ verilen işi anlayan, yapan,
        test eden, takıldığında erkenden söyleyen ve sonunda içiniz rahat teslim eden birine
        ihtiyacı var. Hata düzeltme, arayüz geliştirme, API entegrasyonu ve test; bunları gerçek
        projelerde yaptım ve sizin ekibinizde de üstlenmeye hazırım.
      en: >-
        AI can write code, but it doesn’t own the work. Your team still needs someone who
        understands the task, does it, tests it, speaks up early when stuck, and hands it over
        so you can stop thinking about it. Bug fixes, UI work, API integrations, tests: I’ve done
        this on real projects and I’m ready to take it on in your team.
    offer:
      tr: Ekibinizin haftasını yiyen işleri bana bırakın; siz daha önemli olana odaklanın.
      en: Hand me the work that eats your team’s week, and focus on what matters more.
  about:
    tr:
      - >-
        Lisede bilişim okurken çalışmaya başladım; teknik serviste geçen yıllar bana iş disiplini
        kazandırdı. Ardından yazılıma geçtim: Uplide ve Dijital Gen’deki stajlarımda Flutter ile
        mobil uygulamalar geliştirdim, REST API entegrasyonu, hata düzeltme ve testlerde yer aldım;
        PetJoo’ya freelance, İyiliği Kodlayanlar’a gönüllü geliştirici olarak katkı verdim.
      - >-
        Bugün İstanbul Topkapı Üniversitesi’nde YBS okurken iOS tarafında Swift ve SwiftUI ile
        Blokla’yı geliştiriyorum. Benim için iyi yazılım akıcı, anlaşılır ve güvenilir olandır.
        Hedefim, ekibine zaman kazandıran ve gönül rahatlığıyla iş verilen bir geliştirici olmak.
    en:
      - >-
        I started working while studying IT in high school; my years in technical service taught
        me work discipline. Then I moved into software: in internships at Uplide and Dijital Gen I
        built mobile apps with Flutter and worked on REST API integration, bug fixing and testing;
        I also contributed to PetJoo as a freelancer and to İyiliği Kodlayanlar as a volunteer developer.
      - >-
        Today, while studying MIS at Istanbul Topkapı University, I’m building Blokla on iOS with
        Swift and SwiftUI. To me, good software is smooth, clear and reliable. My goal is to be the
        developer who saves the team time and can be trusted with work without a second thought.
